<style>

radius:20px;padding:6px 9px}.tiny-pill b{color:var(--cyan)}.bottom{position:absolute;z-index:4;bottom:max(14px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}.controls{pointer-events:auto;display:flex;align-items:flex-end;gap:8px}.action{border:1px solid var(--line);background:linear-gradient(145deg,#17263b,#101827);border-radius:13px;min-height:45px;padding:9px 13px;cursor:pointer;box-shadow:0 8px 25px #0005;transition:transform .15s,border-color .15s}.action:active{transform:scale(.96)}.action.active{border-color:#68f0e288;box-shadow:0 0 16px #68f0e222}.action .label{display:block;font-size:9px;font-weight:900;letter-spacing:.1em}.action .sub{display:block;color:#8697b4;font-size:8px;margin-top:3px}.icon{font-size:16px;margin-right:5px;vertical-align:-2px}.nav{pointer-events:auto;display:flex;gap:5px;background:#0d1524dc;border:1px solid var(--line);padding:5px;border-radius:15px;box-shadow:0 10px 30px #0005}.nav button{background:transparent;border:0;border-radius:10px;color:#8292ad;min-width:51px;height:53px;padding:5px 8px;cursor:pointer}.nav button.selected{background:#1d2b40;color:var(--cyan)}.nav button .ni{display:block;font-size:17px;line-height:20px}.nav button small{display:block;font-size:8px;letter-spacing:.05em;margin-top:3px}.toast{position:absolute;z-index:10;left:50%;top:27%;transform:translate(-50%,-10px);background:#16233a;border:1px solid #68f0e255;border-radius:20px;padding:9px 16px;font-size:11px;font-weight:800;letter-spacing:.04em;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 30px #0006}.toast.show{opacity:1;transform:translate(-50%,0)}.panel-shade{position:absolute;z-index:5;inset:0;background:#0509149c;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.panel-shade.open{display:flex}.panel{width:min(470px,100%);max-height:min(640px,88%);overflow:auto;border:1px solid #9bb9ee25;border-radius:20px;background:linear-gradient(145deg,#172338f5,#0d1523f7);box-shadow:0 24px 80px #0009;padding:20px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:15px}.panel-head h2{margin:0;font-size:16px;letter-spacing:.14em}.panel-head p{margin:5px 0 0;color:#91a1bb;font-size:10px}.close{border:1px solid var(--line);background:#1d2a3e;border-radius:9px;width:32px;height:32px;cursor:pointer;color:#aab8cf}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.upgrade{position:relative;text-align:left;border:1px solid #9bb9ee20;border-radius:13px;background:#111c2c;padding:12px;cursor:pointer;min-height:100px;transition:.15s}.upgrade:hover{border-color:#68f0e280;transform:translateY(-2px)}.upgrade .upicon{font-size:19px}.upgrade h3{margin:7px 0 3px;font-size:11px;letter-spacing:.08em}.upgrade p{margin:0;color:#94a4bd;font-size:9px;line-height:1.45}.upgrade .cost{position:absolute;right:10px;top:10px;color:var(--gold);font-size:9px;font-weight:800}.upgrade:disabled{opacity:.42;cursor:not-allowed;transform:none}.modal-note{color:#8190a8;font-size:9px;text-align:center;margin:14px 0 0}.statsline{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px}.stat-chip{border:1px solid var(--line);background:#101a2a;border-radius:9px;padding:7px 9px;font-size:9px;color:#a6b6ce}.stat-chip b{color:#eff4ff}.toast{z-index:7}
@media(max-width:620px){.topbar{left:12px;right:12px}.brand h1{font-size:15px}.eyebrow{font-size:7px}.resources{gap:4px}.res{padding:6px 7px;min-width:auto;gap:4px;border-radius:9px}.res em{display:none}.res span{font-size:10px}.zone{top:48px}.combat-hud{top:105px}.hero-hud{top:108px;left:12px;width:125px}.hud-right{top:106px;right:12px}.bottom{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));gap:6px;align-items:flex-end}.controls{gap:5px}.action{min-height:41px;padding:8px 9px}.action .label{font-size:8px}.action .sub{font-size:7px}.nav{gap:0;padding:4px;border-radius:13px}.nav button{min-width:43px;height:48px;padding:4px}.nav button .ni{font-size:15px}.nav button small{font-size:7px}.cards{gap:7px}.panel{padding:16px}.panel-shade{padding:12px}}

<body><main id="app"><canvas id="game"></canvas><div class="vignette"></div><div class="grain"></div>
<header class="topbar"><div class="brand"><div class="eyebrow">RIFTBOUND // SURVIVOR</div><h1>SOUL <span>EATER</span></h1></div><div class="zone"><small>ACTIVE EXPEDITION</small><strong id="zoneName">THE ASHEN WILD</strong><div class="stage"><button id="prevZone" aria-label="Previous zone">‹</button><span id="zoneStage">ZONE 01 · WAVE 1</span><button id="nextZone" aria-label="Next zone">›</button></div></div><div class="resources"><div class="res"><i>◈</i><span id="souls">0</span><em>SOULS</em></div><div class="res"><i>✦</i><span id="shards">0</span><em>SHARDS</em></div></div></header>
<section class="hero-hud"><div class="hero-name"><span>VESPER · LV <b id="level">1</b></span><span id="combo">×1.0</span></div><div class="healthbar"><i id="healthFill"></i></div><div class="healthnote"><span id="healthText">100 / 100</span> &nbsp;·&nbsp; <span id="regenText">+0.6 /s</span></div></section>

<div class="hud-right"><div class="tiny-pill">⚔ <b id="attackReadout">12</b> ATK</div><div class="tiny-pill">◉ <b id="enemyCount">0</b> NEARBY</div></div>
<div class="bottom"><div class="controls"><button class="action active" id="autoBtn"><span class="label"><span class="icon">⟳</span>AUTO-HOOK <b id="autoState">ON</b></span><span class="sub">AUTO DEVOUR · <b id="autoDevour">ON</b></span></button><button class="action" id="burstBtn"><span class="label"><span class="icon">✧</span>SOUL BURST</span><span class="sub">READY · SPACE</span></button></div><nav class="nav"><button data-panel="upgrades"><span class="ni">⬆</span><small>GROW</small></button><button data-panel="soul"><span class="ni">✧</span><small>SOUL</small></button><button data-panel="gear"><span class="ni">⬡</span><small>GEAR</small></button><button data-panel="modes"><span class="ni">◈</span><small>MODES</small></button></nav></div>

<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const zones=[{name:'THE ASHEN WILD',ground:'#17242b',glow:'#69efde',enemy:'Mireling'},{name:'HOLLOW MOON',ground:'#211d36',glow:'#b695ff',enemy:'Lunaspawn'},{name:'EMBERFALL',ground:'#301d25',glow:'#ff9870',enemy:'Cinderkin'},{name:'THE SUNKEN VEIL',ground:'#142b37',glow:'#6ad5ff',enemy:'Drowned'}];
let W=0,H=0,dpr=1,last=0,elapsed=0,spawnTimer=0,saveTimer=0,toastTimer=0;
let data={souls:0,shards:0,level:1,xp:0,xpNeed:24,zone:0,wave:1,kills:0,bossKills:0,auto:true,autoDevour:true,upgrade:{attack:0,speed:0,health:0,crit:0,regen:0,armor:0},owned:{weapon:0,armor:0,relic:0},soulNodes:{ember:0,flow:0,heart:0},lastSeen:Date.now()};
try{const saved=JSON.parse(localStorage.getItem('soulEaterSave'));if(saved)data={...data,...saved,upgrade:{...data.upgrade,...saved.upgrade},owned:{...data.owned,...saved.owned},soulNodes:{...data.soulNodes,...saved.soulNodes}}}catch{}
const hero={x:0,y:0,hp:100,attackTimer:0,hook:null,burst:0,hitFlash:0};let enemies=[],particles=[],floats=[],shake=0,pointer={x:0,y:0},selectedPanel='';
const base={hp:100,atk:12,spd:1,regen:.6,armor:0,crit:5};
function stat(k){let u=data.upgrade[k]||0,gear=data.owned||{},nodes=data.soulNodes||{};return({health:(base.hp+u*24+(gear.armor||0)*35)*(1+(nodes.heart||0)*.10),attack:(base.atk+u*4+data.level*.65+(gear.weapon||0)*8)*(1+(nodes.ember||0)*.07),speed:base.spd+u*.14+(nodes.flow||0)*.03,regen:base.regen+u*.45,armor:u*2,crit:base.crit+u*3+(gear.relic||0)*5})[k]||0}
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);hero.x=W/2;hero.y=H*.56}
new ResizeObserver(resize).observe(canvas);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function save(){data.lastSeen=Date.now();try{localStorage.setItem('soulEaterSave',JSON.stringify(data))}catch{}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function addFloat(x,y,text,color='#bdfbf1'){floats.push({x,y,text,color,life:1,vy:-27})}
function spawn(boss=false){let a=rand(0,Math.PI*2),radius=Math.min(W,H)*rand(.36,.49),x=hero.x+Math.cos(a)*radius,y=hero.y+Math.sin(a)*radius*.60;let scale=boss?2.45:rand(.8,1.25),hp=boss?190+data.wave*55:18+data.wave*3+data.zone*5;enemies.push({x,y,z:rand(.9,1.25),hp,max:hp,r:(boss?23:10)*scale,speed:boss?rand(13,19):rand(18,30),boss,phase:rand(0,7),attack:0,drag:0,dead:false});if(boss){$('bossbar').classList.add('show');toast('RIFT TITAN HAS BREACHED') }}
function kill(e){if(e.dead)return;e.dead=true;const soul=e.boss?30+data.zone*8:2+Math.floor(Math.random()*3);data.souls+=soul;data.shards+=e.boss?5:Math.random()<.16?1:0;data.xp+=e.boss?18:5;data.kills++;if(e.boss){data.bossKills++;data.wave++;$('bossbar').classList.remove('show');data.shards+=8;toast('TITAN DEVOURED · +8 SHARDS')}let needed=false;while(data.xp>=data.xpNeed){data.xp-=data.xpNeed;data.level++;data.xpNeed=Math.floor(data.xpNeed*1.24+8);hero.hp=Math.min(stat('health'),hero.hp+30);needed=true}addFloat(e.x,e.y-15,`+${soul} SOULS`,e.boss?'#ffd27d':'#83f6df');for(let i=0;i<14;i++)particles.push({x:e.x,y:e.y,vx:rand(-90,90),vy:rand(-110,70),life:rand(.35,.8),size:rand(2,5),color:e.boss?'#ffba79':zones[data.zone].glow});if(needed)toast(`LEVEL ${data.level} · POWER SURGED`);if(data.kills%12===0&&!e.boss){data.wave++;toast(`WAVE ${data.wave} CLEARED`)} }
function effectiveDamage(){return stat('attack')*(Math.random()*100<stat('crit')?2.25:1)}
function attack(){if(!data.auto||hero.hook||!enemies.some(e=>!e.dead))return;let target=enemies.filter(e=>!e.dead).sort((a,b)=>Math.hypot(a.x-hero.x,a.y-hero.y)-Math.hypot(b.x-hero.x,b.y-hero.y))[0];if(!target)return;hero.hook={target,phase:'out',t:0,x:hero.x,y:hero.y};hero.attackTimer=Math.max(.35,1.05/stat('speed'))}
function burst(){if(hero.burst>0)return;hero.burst=8;let n=0;enemies.forEach(e=>{if(!e.dead){e.hp-=stat('attack')*3.1;if(e.hp<=0)kill(e);n++}});for(let i=0;i<40;i++)particles.push({x:hero.x,y:hero.y,vx:rand(-200,200),vy:rand(-180,180),life:rand(.3,.85),size:rand(2,6),color:i%2?'#b99aff':'#68f0e2'});shake=8;toast(n?`SOUL BURST · ${n} ENEMIES STRUCK`:'SOUL BURST · READY TO DEVOUR')}
function update(dt){elapsed+=dt;hero.hp=Math.min(stat('health'),hero.hp+stat('regen')*dt);hero.attackTimer-=dt;hero.burst=Math.max(0,hero.burst-dt);if(hero.hitFlash>0)hero.hitFlash-=dt;spawnTimer-=dt;if(spawnTimer<=0){let boss=(data.wave%5===0)&&!enemies.some(e=>e.boss&&!e.dead);if(enemies.filter(e=>!e.dead).length<8)spawn(boss);spawnTimer=rand(.8,1.7)}if(hero.attackTimer<=0)attack();
for(const e of enemies){if(e.dead)continue;e.phase+=dt*2;const dx=hero.x-e.x,dy=hero.y-e.y,d=Math.hypot(dx,dy)||1;if(d>31){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*.65*dt}else{e.attack-=dt;if(e.attack<=0){e.attack=e.boss?1.05:1.35;let dmg=Math.max(1,(e.boss?12:5)-stat('armor'));hero.hp=Math.max(0,hero.hp-dmg);hero.hitFlash=.18;addFloat(hero.x+rand(-12,12),hero.y-30,`-${dmg}`,'#ff8196');if(hero.hp<=0){hero.hp=stat('health')*.55;data.souls=Math.floor(data.souls*.9);enemies.forEach(q=>q.dead=true);toast('RECONSTITUTED · 10% SOULS LOST');shake=10}}}}
if(hero.hook){let h=hero.hook,e=h.target;if(e.dead){hero.hook=null}else{h.t+=dt*2.7;if(h.phase==='out'){h.x+=(e.x-h.x)*Math.min(1,dt*9);h.y+=(e.y-h.y)*Math.min(1,dt*9);if(Math.hypot(e.x-h.x,e.y-h.y)<14){h.phase='pull';e.drag=1}}else if(h.phase==='pull'){e.x+=(hero.x-e.x)*Math.min(1,dt*3.3);e.y+=(hero.y-e.y)*Math.min(1,dt*3.3);e.hp-=stat('attack')*dt*1.5;if(Math.hypot(e.x-hero.x,e.y-hero.y)<39){if(data.autoDevour)kill(e);else addFloat(e.x,e.y-18,'TAP TO DEVOUR','#ffd27d');hero.hook=null}}}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy+=35*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floats){f.y+=f.vy*dt;f.life-=dt}floats=floats.filter(f=>f.life>0);enemies=enemies.filter(e=>!e.dead||Math.random()>.95);if(shake>0)shake=Math.max(0,shake-dt*20);
saveTimer+=dt;if(saveTimer>4){save();saveTimer=0}updateUI()}
function path(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function drawGround(){const z=zones[data.zone];let bg=ctx.createRadialGradient(W*.5,H*.53,10,W*.5,H*.53,Math.max(W,H)*.65);bg.addColorStop(0,z.ground);bg.addColorStop(.7,'#101825');bg.addColorStop(1,'#080d17');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// Distant rift halo
ctx.save();ctx.translate(W/2,H*.54);ctx.scale(1,.56);let pulse=1+Math.sin(elapsed*1.1)*.025;ctx.rotate(elapsed*.025);ctx.strokeStyle=z.glow+'18';ctx.lineWidth=1;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(0,0,(85+i*33)*pulse,0,Math.PI*2);ctx.stroke()}ctx.restore();
// Perspective floor rings and fine grid
ctx.save();ctx.translate(W*.5,H*.56);ctx.scale(1,.46);for(let r=1;r<10;r++){ctx.beginPath();ctx.arc(0,0,r*54,0,Math.PI*2);ctx.strokeStyle=r%3===0?z.glow+'19':'#a9bdd40b';ctx.lineWidth=r%3===0?1.2:1;ctx.stroke()}for(let i=0;i<24;i++){let a=i*Math.PI/12;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*620,Math.sin(a)*620);ctx.strokeStyle='#acc3e10a';ctx.stroke()}ctx.restore();
// floating embers
for(let i=0;i<36;i++){let x=(i*173+elapsed*(i%2?7:-4))%W,y=(i*97+elapsed*(i%3?11:5))%(H*.78);ctx.globalAlpha=.12+((i*37)%70)/200;ctx.fillStyle=i%4?z.glow:'#f5d894';ctx.beginPath();ctx.arc(x,y,1+(i%3)*.45,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawShadow(x,y,r){ctx.save();ctx.translate(x,y+5);ctx.scale(1,.42);let g=ctx.createRadialGradient(0,0,1,0,0,r*1.5);g.addColorStop(0,'#0009');g.addColorStop(1,'#0000');ctx.fillStyle=g;path(0,0,r*1.5,r*.9);ctx.fill();ctx.restore()}
function drawEnemy(e){let z=zones[data.zone],bob=Math.sin(e.phase)*2,scale=e.z;ctx.save();ctx.translate(e.x,e.y+bob);drawShadow(0,0,e.r);ctx.scale(scale,scale);let r=e.r,c=e.boss?'#cf678b':data.zone===1?'#8f79d2':data.zone===2?'#e77b5d':'#65b9a2';
// body orb
let g=ctx.createRadialGradient(-r*.34,-r*.4,2,0,0,r*1.3);g.addColorStop(0,'#f2d9ff');g.addColorStop(.18,c);g.addColorStop(1,'#152033');ctx.fillStyle=g;path(0,0,r,r*.87);ctx.fill();ctx.strokeStyle=e.boss?'#ffbf90':'#c3f6eb66';ctx.lineWidth=e.boss?2:1;ctx.stroke();
// horns / fins
ctx.fillStyle=c;for(let s of [-1,1]){ctx.beginPath();ctx.moveTo(s*r*.45,-r*.42);ctx.lineTo(s*r*.88,-r*1.25);ctx.lineTo(s*r*.19,-r*.68);ctx.closePath();ctx.fill()}
ctx.fillStyle='#ffecb1';for(let s of [-1,1]){ctx.beginPath();ctx.ellipse(s*r*.32,-r*.08,r*.13,r*.17,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#311f38';ctx.beginPath();ctx.ellipse(0,r*.3,r*.3,r*.1,0,0,Math.PI*2);ctx.fill();
// health bar
ctx.fillStyle='#070d18c9';ctx.fillRect(-r,-r*1.55,r*2,3);ctx.fillStyle=e.boss?'#ff7388':z.glow;ctx.fillRect(-r,-r*1.55,r*2*clamp(e.hp/e.max,0,1),3);if(e.boss){ctx.fillStyle='#ffd2bf';ctx.font='800 8px system-ui';ctx.textAlign='center';ctx.fillText('RIFT TITAN',0,-r*1.8)}ctx.restore()}
function drawHero(){let x=hero.x,y=hero.y+Math.sin(elapsed*2)*1.5;drawShadow(x,y,21);ctx.save();ctx.translate(x,y);let flash=hero.hitFlash>0;ctx.shadowColor=flash?'#ff7188':'#68f0e2';ctx.shadowBlur=flash?24:16;
// cape
ctx.fillStyle='#553e87';ctx.beginPath();ctx.moveTo(-8,-5);ctx.quadraticCurveTo(-26,12,-16,28);ctx.lineTo(1,17);ctx.lineTo(11,28);ctx.quadraticCurveTo(22,4,8,-8);ctx.closePath();ctx.fill();
// legs and torso
ctx.shadowBlur=0;ctx.fillStyle='#263a59';ctx.beginPath();ctx.roundRect(-10,3,8,15,4);ctx.roundRect(2,3,8,15,4);ctx.fill();let g=ctx.createLinearGradient(-12,-15,12,12);g.addColorStop(0,flash?'#ffb0ba':'#a4fff3');g.addColorStop(.5,'#4fc4bc');g.addColorStop(1,'#283e62');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-12,-8);ctx.quadraticCurveTo(0,-16,12,-8);ctx.lineTo(10,9);ctx.quadraticCurveTo(0,15,-10,9);ctx.closePath();ctx.fill();
// head
ctx.fillStyle='#d9f4e9';path(0,-16,7.3,8);ctx.fill();ctx.fillStyle='#182a42';ctx.beginPath();ctx.moveTo(-8,-18);ctx.lineTo(-2,-28);ctx.lineTo(0,-18);ctx.lineTo(6,-26);ctx.lineTo(8,-16);ctx.closePath();ctx.fill();ctx.fillStyle='#69f4e0';ctx.fillRect(2,-17,3,2);
// blade
ctx.save();ctx.rotate(-.43+Math.sin(elapsed*5)*.05);ctx.strokeStyle='#a5fff0';ctx.lineWidth=3;ctx.shadowColor='#69f0e2';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(10,-1);ctx.lineTo(20,-17);ctx.stroke();ctx.restore();
// ground sigil
ctx.globalAlpha=.5+Math.sin(elapsed*3)*.12;ctx.strokeStyle='#69f0e277';ctx.lineWidth=1;path(0,14,20,7);ctx.stroke();ctx.restore()}
function drawHook(){if(!hero.hook)return;const h=hero.hook,e=h.target;ctx.save();ctx.lineCap='round';ctx.shadowBlur=12;ctx.shadowColor='#6df2e8';let g=ctx.createLinearGradient(hero.x,hero.y,e.x,e.y);g.addColorStop(0,'#d7fff1');g.addColorStop(.35,'#67f0df');g.addColorStop(1,'#a98cff');ctx.strokeStyle=g;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(hero.x,hero.y-8);ctx.quadraticCurveTo((hero.x+e.x)/2+(e.y-hero.y)*.13,(hero.y+e.y)/2-(e.x-hero.x)*.13,e.x,e.y);ctx.stroke();ctx.translate(e.x,e.y);ctx.rotate(elapsed*8);ctx.strokeStyle='#dcfff7';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-9);ctx.lineTo(4,-5);ctx.stroke()}ctx.restore()}
function draw(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawGround();for(const e of enemies)if(!e.dead)drawEnemy(e);drawHook();drawHero();for(const p of particles){ctx.globalAlpha=clamp(p.life*1.7,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floats){ctx.globalAlpha=clamp(f.life,0,1);ctx.fillStyle=f.color;ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.shadowColor='#07101c';ctx.shadowBlur=4;ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;ctx.restore()}
function updateUI(){ $('souls').textContent=compact(data.souls);$('shards').textContent=compact(data.shards);$('level').textContent=data.level;$('zoneName').textContent=zones[data.zone].name;$('zoneStage').textContent=`ZONE ${String(data.zone+1).padStart(2,'0')} · WAVE ${data.wave}`;$('healthFill').style.width=`${clamp(hero.hp/stat('health')*100,0,100)}%`;$('healthText').textContent=`${Math.ceil(hero.hp)} / ${stat('health')}`;$('regenText').textContent=`+${stat('regen').toFixed(1)} /s`;$('attackReadout').textContent=Math.round(stat('attack'));$('enemyCount').textContent=enemies.filter(e=>!e.dead).length;$('waveLabel').innerHTML=`WAVE ${data.wave} <span style="color:#647590">—</span> RIFT ACTIVITY`;$('waveFill').style.width=`${(data.kills%12)/12*100}%`;$('autoState').textContent=data.auto?'ON':'OFF';$('autoDevour').textContent=data.autoDevour?'ON':'OFF';$('autoBtn').classList.toggle('active',data.auto);let boss=enemies.find(e=>e.boss&&!e.dead);if(boss){$('bossbar').classList.add('show');$('bossFill').style.width=`${clamp(boss.hp/boss.max*100,0,100)}%`;$('bossHealthText').textContent=`${Math.ceil(boss.hp/boss.max*100)}%`}else $('bossbar').classList.remove('show');$('burstBtn').querySelector('.sub').textContent=hero.burst>0?`COOLDOWN · ${hero.burst.toFixed(1)}s`:'READY · SPACE'}
function compact(n){return n>=10000?(n/1000).toFixed(1)+'k':Math.floor(n).toLocaleString()}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function prices(k){let n=data.upgrade[k]||0;return Math.floor(({attack:24,speed:30,health:22,crit:35,regen:27,armor:31})[k]*Math.pow(1.48,n))}
const upgradeInfo={attack:['⚔','RIFT EDGE','Attack damage +4','attack'],speed:['➶','QUICKENING','Hook speed +14%','speed'],health:['♥','VITAL CORE','Max health +24','health'],crit:['✹','FATAL THREAD','Critical chance +3%','crit'],regen:['✚','SOUL MENDING','Health regen +0.45/s','regen'],armor:['⬡','WRAITHSKIN','Armor +2','armor']};
function openPanel(which){selectedPanel=which;$('shade').classList.add('open');renderPanel()}
function renderPanel(){let title=$('panelTitle'),sub=$('panelSub'),content=$('panelContent');content.innerHTML='';
if(selectedPanel==='upgrades'){title.textContent='PERMANENT EVOLUTION';sub.textContent='Every consumed soul carries your power forward.';let chips=document.createElement('div');chips.className='statsline';chips.innerHTML=`<div class="stat-chip">LEVEL <b>${data.level}</b></div><div class="stat-chip">ATK <b>${Math.round(stat('attack'))}</b></div><div class="stat-chip">CRIT <b>${stat('crit')}%</b></div><div class="stat-chip">REGEN <b>${stat('regen').toFixed(1)}/s</b></div>`;content.append(chips);let cards=document.createElement('div');cards.className='cards';Object.entries(upgradeInfo).forEach(([k,v])=>{let cost=prices(k),b=document.createElement('button');b.className='upgrade';b.disabled=data.souls<cost;b.innerHTML=`<span class="upicon">${v[0]}</span><span class="cost">◈ ${cost}</span><h3>${v[1]} · ${data.upgrade[k]}</h3><p>${v[2]}<br><span style="color:#66e8d9">Next: ${v[3]==='attack'?`+${Math.round(4)} ATK`:v[3]==='speed'?'+14% speed':v[3]==='health'?'+24 HP':v[3]==='crit'?'+3% crit':v[3]==='regen'?'+0.45 regen':'+2 armor'}</span></p>`;b.onclick=()=>{if(data.souls<cost)return;data.souls-=cost;data.upgrade[k]++;if(k==='health')hero.hp=Math.min(stat('health'),hero.hp+24);toast(`${v[1]} UPGRADED`);save();renderPanel()};cards.append(b)});content.append(cards);}
if(selectedPanel==='soul'){title.textContent='THE SOUL GRAPH';sub.textContent='Three paths. One unstoppable wraith.';let chips=document.createElement('div');chips.className='statsline';chips.innerHTML=`<div class="stat-chip">SOULS <b>◈ ${compact(data.souls)}</b></div><div class="stat-chip">SHARDS <b>✦ ${compact(data.shards)}</b></div>`;content.append(chips);let cards=document.createElement('div');cards.className='cards';let nodes=[['ember','🔥','EMBER HEART','+7% attack damage','Soul burn cuts through armor.'],['flow','〰','ECHO FLOW','+15% hook reach','Your chain finds prey sooner.'],['heart','💠','ABYSSAL HEART','+10% health','A deeper well of vitality.']];nodes.forEach(([k,icon,name,bonus,desc])=>{let lvl=data.soulNodes[k],cost=3+lvl*3,b=document.createElement('button');b.className='upgrade';b.disabled=data.shards<cost;b.innerHTML=`<span class="upicon">${icon}</span><span class="cost">✦ ${cost}</span><h3>${name} · ${lvl}/5</h3><p>${bonus}<br>${desc}</p>`;b.onclick=()=>{if(lvl>=5||data.shards<cost)return;data.shards-=cost;data.soulNodes[k]++;toast(`${name} AWAKENED`);save();renderPanel()};cards.append(b)});content.append(cards);content.insertAdjacentHTML('beforeend','<p class="modal-note">Titan kills grant shards. Each node maxes at rank 5.</p>')}
if(selectedPanel==='gear'){title.textContent='RELIC LOADOUT';sub.textContent='Equip relics recovered from rift breaches.';let cards=document.createElement('div');cards.className='cards';let items=[['weapon','🗡','VOIDCLEAVER','+8 attack damage',10],['armor','⛨','PHANTOM MAIL','+35 max health',10],['relic','◉','DEVOURING EYE','+5% critical chance',14]];items.forEach(([k,icon,name,desc,cost])=>{let rank=data.owned[k],b=document.createElement('button');b.className='upgrade';b.disabled=data.shards<cost||rank>=3;b.innerHTML=`<span class="upicon">${icon}</span><span class="cost">${rank>=3?'MAX':`✦ ${cost}`}</span><h3>${name} · ${rank>0?'RANK '+rank:'LOCKED'}</h3><p>${desc}<br>${rank?'Equipped · '+(rank<3?'Tap to forge rank '+(rank+1):'maximum rank'):'Forge with shards.'}</p>`;b.onclick=()=>{if(data.shards<cost||rank>=3)return;data.shards-=cost;data.owned[k]++;toast(`${name} FORGED`);save();renderPanel()};cards.append(b)});content.append(cards);content.insertAdjacentHTML('beforeend','<p class="modal-note">Gear bonuses are active as soon as the relic is forged.</p>')}
if(selectedPanel==='modes'){title.textContent='RIFT EXPEDITIONS';sub.textContent='Choose your hunt. Progress is saved on this device.';let cards=document.createElement('div');cards.className='cards';let modes=[['◈','ASHEN WILD','A low-threat hunting ground.',0],['☾','HOLLOW MOON','Spectral prey · +20% rewards.',1],['♨','EMBERFALL','Fierce prey · +40% rewards.',2],['≋','SUNKEN VEIL','Abyssal prey · +65% rewards.',3]];modes.forEach(([ico,name,desc,id])=>{let b=document.createElement('button');b.className='upgrade';b.innerHTML=`<span class="upicon">${ico}</span><span class="cost">${id===data.zone?'ACTIVE':'ZONE '+String(id+1).padStart(2,'0')}</span><h3>${name}</h3><p>${desc}<br>${id>data.zone?'Unlock by clearing 5 waves.':'Tap to enter expedition.'}</p>`;b.disabled=id>data.zone;b.onclick=()=>{if(id>data.zone)return;data.zone=id;enemies=[];hero.hook=null;toast(`ENTERED ${name}`);save();renderPanel()};cards.append(b)});content.append(cards);let toggles=document.createElement('div');toggles.className='statsline';toggles.style.marginTop='12px';[['AUTO-BATTLE',data.auto,'auto'],['AUTO-DEVOUR',data.autoDevour,'devour']].forEach(([label,on,key])=>{let b=document.createElement('button');b.className='action'+(on?' active':'');b.innerHTML=`<span class="label">${label} · ${on?'ON':'OFF'}</span>`;b.onclick=()=>{if(key==='auto')data.auto=!data.auto;else data.autoDevour=!data.autoDevour;save();renderPanel()};toggles.append(b)});content.append(toggles);content.insertAdjacentHTML('beforeend','<p class="modal-note">Auto-battle keeps your hook hunting. Defeated prey are always consumed.</p>')}
}
$('closePanel').addEventListener('click',()=>$('shade').classList.remove('open'));$('shade').addEventListener('click',e=>{if(e.target===$('shade'))$('shade').classList.remove('open')});document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('selected',x===b));openPanel(b.dataset.panel)}));
$('autoBtn').addEventListener('click',()=>{if(data.auto){data.auto=false;data.autoDevour=!data.autoDevour}else data.auto=true;save();toast(`AUTO-HOOK ${data.auto?'ON':'OFF'} · DEVOUR ${data.autoDevour?'ON':'OFF'}`);updateUI()});$('burstBtn').addEventListener('click',burst);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();burst()}if(e.key==='Escape')$('shade').classList.remove('open')});
$('prevZone').onclick=()=>{data.zone=(data.zone+zones.length-1)%zones.length;data.zone=Math.min(data.zone,Math.floor((data.wave-1)/5));enemies=[];toast(zones[data.zone].name);save()};$('nextZone').onclick=()=>{if(data.zone<Math.min(zones.length-1,Math.floor((data.wave-1)/5))){data.zone++;enemies=[];toast(`ENTERED ${zones[data.zone].name}`);save()}else toast('CLEAR 5 WAVES TO UNLOCK')};canvas.addEventListener('pointerdown',e=>{if($('shade').classList.contains('open'))return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let target=enemies.filter(q=>!q.dead).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(target&&Math.hypot(target.x-x,target.y-y)<65){if(!data.autoDevour&&Math.hypot(target.x-hero.x,target.y-hero.y)<55){kill(target);toast('MANUAL DEVOUR · SOUL ABSORBED')}else{hero.hook={target,phase:'out',t:0,x:hero.x,y:hero.y};hero.attackTimer=Math.max(hero.attackTimer,.6)}}});
// Resume a modest offline hunt (capped to eight hours).
const away=Math.min(8*60*60,Math.max(0,(Date.now()-(data.lastSeen||Date.now()))/1000));if(away>60){const gain=Math.floor(away/60*(.45+data.zone*.1));data.souls+=gain;data.xp+=Math.floor(away/90);while(data.xp>=data.xpNeed){data.xp-=data.xpNeed;data.level++;data.xpNeed=Math.floor(data.xpNeed*1.24+8)}setTimeout(()=>toast(`WELCOME BACK · +${gain} OFFLINE SOULS`),600)}hero.hp=stat('health');updateUI();save();
})();
</script></body></html>
